name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ffmpeg curl
          brew link --force curl || true

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p out
          zip -j "out/d2m3u-${{ inputs.version }}-darwin-arm64.zip" d2m3u

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: out/*.zip

  build-linux-x86_64:
    name: Build linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavutil-dev libcurl4-openssl-dev

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p out
          tar -czf "out/d2m3u-${{ inputs.version }}-linux-x86_64.tar.gz" d2m3u

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/*.tar.gz

  build-windows-x86_64:
    name: Build windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          shell: pwsh

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nsis
            zip

      - name: Build installer
        run: |
          VERSION_NUM="${{ inputs.version }}"
          VERSION_NUM="${VERSION_NUM#v}"
          make installer VERSION="$VERSION_NUM"

      - name: Package
        run: |
          mkdir -p out
          installer_file=$(ls d2m3u-setup*.exe | head -n1)
          zip -j "out/d2m3u-${{ inputs.version }}-windows-x86_64.zip" "$installer_file"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: out/*.zip

  release:
    name: Create release
    needs: [build-macos-arm64, build-linux-x86_64, build-windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            artifacts/darwin-arm64/*.zip
            artifacts/linux-x86_64/*.tar.gz
            artifacts/windows-x86_64/*.zip
